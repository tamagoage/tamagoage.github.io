name: Deploy Quartz Site to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout content repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Checkout Quartz v4
        run: git clone --depth 1 --branch v4 https://github.com/jackyzha0/quartz.git .quartz

      - name: Install Quartz dependencies
        working-directory: .quartz
        run: npm ci

      - name: Apply site configuration
        run: |
          cp quartz.config.ts .quartz/quartz.config.ts
          cp quartz.layout.ts .quartz/quartz.layout.ts

      - name: Build site
        working-directory: .quartz
        run: npx quartz build --directory ../content

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .quartz/public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
